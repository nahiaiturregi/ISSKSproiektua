version: '3.8'

services:
  web:
    image: web
    environment:
      - ALLOW_OVERRIDE=true
    ports:
      - "81:443"
    links:
      - db
    volumes:
      - ./app:/var/www/html/
      - ./cert:/etc/ssl/
      - ./localhost.conf:/etc/apache2/sites-available/000-default.conf

  db:
    image: mariadb:10.8.2
    restart: always
    volumes:
      - ./mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: admin
      MYSQL_PASSWORD: test
      MYSQL_DATABASE: database
    ports:
      - "8889:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.1
    links:
      - db
    ports:
      - 8890:80
    environment:
      MYSQL_USER: admin
      MYSQL_PASSWORD: test
      MYSQL_DATABASE: database
